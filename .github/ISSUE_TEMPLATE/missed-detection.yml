name: Mesh let a secret through
description: Mesh let a secret through.
labels:
- missed-detection
body:
- type: markdown
  attributes:
    value: If this lets someone bypass Mesh on purpose, report it privately through the [security link](https://github.com/SkilakLabs/smesh/security/advisories/new)
      instead. Describe the secret format, never paste a real one; rotate any real secret that leaked.
      Never paste API keys, tokens, prompts, file contents or the real value Mesh matched. Review diagnostics
      and logs for personal data before posting.
- type: textarea
  id: version
  attributes:
    label: Output of smesh version
    render: shell
  validations:
    required: true
- type: dropdown
  id: os
  attributes:
    label: OS and architecture
    options:
    - macOS arm64
    - macOS x86_64
    - Linux x86_64
    - Windows x86_64
  validations:
    required: true
- type: dropdown
  id: client
  attributes:
    label: Client
    options:
    - Claude Code
    - Codex
    - both
    - none
  validations:
    required: true
- type: textarea
  id: content_kind
  attributes:
    label: What kind of secret got through?
    description: 'Describe the format instead of pasting it, for example: a cloud API key starting with a fixed prefix.'
  validations:
    required: true
- type: textarea
  id: path
  attributes:
    label: How did it reach the AI tool?
    description: For example, pasted into a prompt, read from a file, or returned by a tool or MCP server.
  validations:
    required: true
- type: textarea
  id: example
  attributes:
    label: Redacted example with the same shape
    description: Use made-up values only. Do not include prompts or file contents.
  validations:
    required: true
